{{- $buckets := (include "seaweedfs-provisioning.bucketsWithPaths" . | fromJsonArray) -}}
{{- if and $buckets (not .Values.credentials.existingSecret.name) -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "seaweedfs-provisioning.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "seaweedfs-provisioning.labels" . | nindent 4 }}
stringData:
  accessKey: {{ required "credentials.accessKey is required unless credentials.existingSecret.name is set" .Values.credentials.accessKey | quote }}
  secretKey: {{ required "credentials.secretKey is required unless credentials.existingSecret.name is set" .Values.credentials.secretKey | quote }}
{{- end }}
