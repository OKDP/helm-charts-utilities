{{- $buckets := (include "seaweedfs-provisioning.bucketsWithPaths" . | fromJsonArray) -}}
{{- if $buckets -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "seaweedfs-provisioning.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "seaweedfs-provisioning.labels" . | nindent 4 }}
  annotations:
    # Jobs are immutable, so the job is recreated on every install and upgrade rather
    # than patched in place: a rotated credential or an added path is always picked up.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.job.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit | int }}
  template:
    metadata:
      name: {{ include "seaweedfs-provisioning.fullname" . }}
      labels:
        {{- include "seaweedfs-provisioning.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.job.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.job.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mc
          image: {{ .Values.job.image | quote }}
          imagePullPolicy: {{ .Values.job.imagePullPolicy }}
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "seaweedfs-provisioning.credentialsSecretName" . }}
                  key: {{ include "seaweedfs-provisioning.accessKeyKey" . }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "seaweedfs-provisioning.credentialsSecretName" . }}
                  key: {{ include "seaweedfs-provisioning.secretKeyKey" . }}
          {{- with .Values.job.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: {{ include "seaweedfs-provisioning.fullname" . }}
            items:
              - key: provision.sh
                path: provision.sh
{{- end }}
