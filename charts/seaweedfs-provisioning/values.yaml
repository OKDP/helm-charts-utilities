# -- Override the chart name (affects resource naming).
nameOverride: ""
# -- Override the full release name (affects resource naming).
fullnameOverride: ""

# -- Buckets whose prefixes must be seeded. Buckets themselves are NOT created here:
# they are expected to already exist (the SeaweedFS chart creates them). Entries
# without `paths` are ignored, and when no entry has a path the chart renders nothing.
# Example:
# buckets:
#   - name: spark-events
#     paths: ["event-logs"]
buckets: []

# -- S3 endpoint of the SeaweedFS gateway to provision against.
# Usually the in-cluster service, e.g. "http://my-seaweedfs-s3.my-namespace:8333".
endpoint: ""

# -- Credentials of an identity allowed to write to the buckets above.
credentials:
  # -- Reference an existing Secret holding the credentials. Takes precedence over
  # the inline accessKey/secretKey below.
  existingSecret:
    # -- Name of the existing Secret. Leave empty to use the inline credentials.
    name: ""
    # -- Key holding the access key inside the existing Secret.
    accessKeyKey: accessKey
    # -- Key holding the secret key inside the existing Secret.
    secretKeyKey: secretKey
  # -- Inline access key, stored in a Secret created by this chart.
  accessKey: ""
  # -- Inline secret key, stored in a Secret created by this chart.
  secretKey: ""

# -- Name of the marker object created inside each seeded prefix.
markerObject: .keep

# -- Provisioning job settings.
job:
  # -- Image providing the `mc` client used to talk to the S3 endpoint.
  image: minio/mc:latest
  # -- Image pull policy for the provisioning job.
  imagePullPolicy: IfNotPresent
  # -- Number of retries before the provisioning job is considered failed.
  backoffLimit: 20
  # -- Seconds the job waits for the S3 endpoint and the buckets to become available.
  waitTimeoutSeconds: 300
  # -- Extra annotations to add to the provisioning job.
  annotations: {}
  # -- Resource requests and limits for the provisioning job.
  resources: {}
  # -- Node selector for the provisioning job.
  nodeSelector: {}
  # -- Tolerations for the provisioning job.
  tolerations: []
