apiVersion: v2
appVersion: 1.0.0
description: |
  Helm chart that seeds object prefixes inside existing SeaweedFS buckets.
  S3 exposes no real directories, so a consumer that requires a prefix to exist
  before writing to it (for example Spark's FsHistoryProvider, which refuses to
  start when its log directory is missing) needs an empty marker object created
  upfront.
type: application
home: https://okdp.io/
icon: https://okdp.io/logos/okdp-notext.svg
keywords:
  - seaweedfs
  - s3
  - object-storage
  - provisioning
  - okdp
maintainers:
  - email: alexandre.mabrouk@cgi.com
    name: alex-mabrouk
    url: https://github.com/alex-mabrouk
name: seaweedfs-provisioning
sources:
  - https://github.com/OKDP/okdp-sandbox
version: 1.1.0
