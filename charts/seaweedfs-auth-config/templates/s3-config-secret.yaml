{{- if and .Values.s3Config.enabled (gt (len (.Values.s3Config.identities | default list)) 0) -}}
{{- $secretName := required "s3Config.secretName is required when s3Config.enabled=true" .Values.s3Config.secretName -}}
{{- $ns := .Release.Namespace -}}
{{- $idents := list -}}

{{- range $i, $id := .Values.s3Config.identities -}}
{{- $ak := "" -}}
{{- $sk := "" -}}
{{- if $id.credentials -}}
{{- /* Inline credentials: values supplied directly. Use this for backend-owned identities
       (e.g. the SeaweedFS admin) whose credentials are not stored in a separate Secret. */ -}}
{{- $ak = required (printf "seaweedfs-auth-config: s3Config.identities[%d].credentials.accessKey is required" $i) $id.credentials.accessKey -}}
{{- $sk = required (printf "seaweedfs-auth-config: s3Config.identities[%d].credentials.secretKey is required" $i) $id.credentials.secretKey -}}
{{- else if $id.credentialsSecret -}}
{{- /* Reference an existing Secret and look up its values at render time (consumer identities). */ -}}
{{- $cs := $id.credentialsSecret -}}
{{- $ak = include "seaweedfs-auth-config.lookupSecretDataB64dec" (dict "namespace" $ns "secretName" $cs.name "key" $cs.accessKeyKey) -}}
{{- $sk = include "seaweedfs-auth-config.lookupSecretDataB64dec" (dict "namespace" $ns "secretName" $cs.name "key" $cs.secretKeyKey) -}}
{{- else -}}
{{- fail (printf "seaweedfs-auth-config: s3Config.identities[%d] requires either 'credentials' (inline) or 'credentialsSecret' (reference)" $i) -}}
{{- end -}}

{{- $idents = append $idents (dict
      "name" $id.name
      "credentials" (list (dict "accessKey" $ak "secretKey" $sk))
      "actions" ($id.actions | default list)
      ) -}}
{{- end -}}

{{- $cfg := dict "identities" $idents -}}

apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ $ns | quote }}
  {{- with .Values.s3Config.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "seaweedfs-auth-config.labels" . | nindent 4 }}
stringData:
  seaweedfs_s3_config: {{ $cfg | toJson | quote }}
{{- end -}}
